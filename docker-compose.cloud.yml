version: "3.9"

services:
  xter-ai-pcb-cloud-core:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    container_name: xter-ai-pcb-cloud-core
    restart: unless-stopped
    environment:
      - XTER_CLOUD_MODE=1
    volumes:
      - ./workspaces:/app/workspaces
      - ./config:/app/config
      - ./skills:/app/skills
    ports:
      - "8989:8989"

  xter-cloud-gateway:
    image: nginx:1.27-alpine
    container_name: xter-cloud-gateway
    restart: unless-stopped
    depends_on:
      - xter-ai-pcb-cloud-core
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist-client:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
